type: dataasset
assets:
  # Nexus XI-XV leave Nexus X through the only free upper-left corridor.
  - id: Task_Network11
    class: /Script/KAPI.KAPIDeliveryTask
    properties:
      - path: mName
        value: "Nexus Expansion XI"
      - path: mDescription
        value: "Raise total Faxit network capacity from ten to eleven."
      - path: mIcon
        value: /Game/FactoryGame/Buildable/Factory/TradingPost/UI/RecipeIcons/Recipe_Icon_Upgrade.Recipe_Icon_Upgrade
      - path: mPriority
        value: 50
      - path: mCoordinate
        value: { X: -1, Y: -11 }
      - path: mParentTask
        value: 128
        # BelowRight: Task_Network10 at (0,-10)
      - path: mCosts
        value:
          - { ItemClass: /Game/FactoryGame/Resource/Parts/MotorLightweight/Desc_MotorLightweight.Desc_MotorLightweight_C, Amount: 125 }
          - { ItemClass: /KLib/Assets/Parts/Production/TimeCrystal/Desc_TimeC_QuantumProcessor.Desc_TimeC_QuantumProcessor_C, Amount: 30 }
          - { ItemClass: /Game/FactoryGame/Resource/Parts/ResourceSinkCoupon/Desc_ResourceSinkCoupon.Desc_ResourceSinkCoupon_C, Amount: 10 }
      - path: mRewards
        value:
          - { ItemClass: /Game/FactoryGame/Resource/Environment/Crystal/Desc_CrystalShard.Desc_CrystalShard_C, Amount: 5 }
    unlocks:
      - class: /KPrivateCodeLib/Unlocks/BP_FaxitCapaUnlock.BP_FaxitCapaUnlock_C
        properties:
          - { path: mCapacityType, value: Network }
          - { path: mAmount, value: 1 }

