type: recipe
recipes:
  # Faxit optical production chain. Raw Kerr Crystal is intentionally not used; Reanimated SAM is stabilized
  # inside a Polarization Frame to produce the Poled Kerr Crystal required by every later component.
  - id: Recipe_Faxit_PolarizationFrame
    properties:
      - path: mDisplayName
        value: Polarization Frame
      - path: mDisplayNameOverride
        value: true
      - path: mIngredients
        value:
          - ItemClass: /Game/FactoryGame/Resource/Parts/SteelPlate/Desc_SteelPlate.Desc_SteelPlate_C
            Amount: 6
          - ItemClass: /Game/FactoryGame/Resource/Parts/CopperSheet/Desc_CopperSheet.Desc_CopperSheet_C
            Amount: 6
      - path: mProduct
        value:
          - ItemClass: /KLib/Assets/Parts/Production/TimeCrystal/Desc_TimeC_Case.Desc_TimeC_Case_C
            Amount: 2
      - path: mManufactoringDuration
        value: 7.5
      - path: mProducedIn
        value:
          - /Game/FactoryGame/Buildable/Factory/AssemblerMk1/Build_AssemblerMk1.Build_AssemblerMk1_C
