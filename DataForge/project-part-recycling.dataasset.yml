type: dataasset
assets:
  # Separate right-side tree. License cost is exactly ten AWESOME Sink coupons.
  - id: Task_ProjectPartRecyclingLicense
    class: /Script/KAPI.KAPIDeliveryTask
    properties:
      - { path: mName, value: "Project-Part Recycling License" }
      - { path: mDescription, value: "Authorize phase-based recycling of obsolete Project Assembly parts." }
      - { path: mIcon, value: /Game/FactoryGame/Buildable/Factory/TradingPost/UI/RecipeIcons/Recipe_Icon_Upgrade.Recipe_Icon_Upgrade }
      - { path: mPriority, value: 30 }
      - { path: mTags, value: [KMods.Delivery.GateUnlock] }
      - { path: mCoordinate, value: { X: 20, Y: -1 } }
      - path: mCosts
        value:
          - { ItemClass: /Game/FactoryGame/Resource/Parts/ResourceSinkCoupon/Desc_ResourceSinkCoupon.Desc_ResourceSinkCoupon_C, Amount: 10 }
      - path: mRewards
        value:
          - { ItemClass: /Game/FactoryGame/Resource/Environment/Crystal/Desc_CrystalShard.Desc_CrystalShard_C, Amount: 1 }
    dependencies:
      - class: /Game/FactoryGame/AvailabilityDependencies/BP_GamePhaseReachedDependency.BP_GamePhaseReachedDependency_C
        properties:
          - { path: mGamePhase, value: EGP_MidGame }
          - { path: mOnlyAllowInSelectedPhase, value: false }

