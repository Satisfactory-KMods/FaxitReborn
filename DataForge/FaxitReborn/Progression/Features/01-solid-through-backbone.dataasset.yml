type: dataasset
assets:
- id: Task_SolidFaxing
  class: /Script/KAPI.KAPIDeliveryTask
  properties:
  - {path: mName, value: Solid Faxing}
  - {path: mDescription, value: Unlock solid input and output processors plus second cable style.}
  - {path: mIcon, value: /KLib/Assets/Buildings/Faxit/UI/Icons/Icon_BuildS_InputSolid.Icon_BuildS_InputSolid}
  - {path: mPriority, value: 90}
  - path: mCoordinate
    value: {X: -1, Y: -2}
  - {path: mParentTask, value: 128}
  - path: mCosts
    value:
    - {ItemClass: /Game/FactoryGame/Resource/Parts/SteelPipe/Desc_SteelPipe.Desc_SteelPipe_C, Amount: 100}
    - {ItemClass: /Game/FactoryGame/Resource/Parts/IronPlateReinforced/Desc_IronPlateReinforced.Desc_IronPlateReinforced_C, Amount: 100}
    - {ItemClass: /KLib/Assets/Parts/Production/TimeCrystal/Desc_TimeC_Cable.Desc_TimeC_Cable_C, Amount: 400}
  - path: mRewards
    value:
    - {ItemClass: /Game/FactoryGame/Resource/Environment/Crystal/Desc_CrystalShard.Desc_CrystalShard_C, Amount: 2}
  unlocks:
  - class: /Game/FactoryGame/Unlocks/BP_UnlockRecipe.BP_UnlockRecipe_C
    properties:
    - path: mRecipes
      value: [/KLib/Assets/Buildings/Faxit/Recipes/Recipe_CS_InputSolid.Recipe_CS_InputSolid_C, /KLib/Assets/Buildings/Faxit/Recipes/Recipe_CS_Output_Solid.Recipe_CS_Output_Solid_C,
        /KLib/Assets/Buildings/Faxit/Recipes/Recipe_CS_Cable_2.Recipe_CS_Cable_2_C]
- id: Task_FluidFaxing
  class: /Script/KAPI.KAPIDeliveryTask
  properties:
  - {path: mName, value: Fluid and Gas Faxing}
  - {path: mDescription, value: Unlock fluid and gas processors plus third cable style.}
  - {path: mIcon, value: /KLib/Assets/Buildings/Faxit/UI/Icons/Icon_BuildS_Input_Fluid.Icon_BuildS_Input_Fluid}
  - {path: mPriority, value: 89}
  - path: mCoordinate
    value: {X: 1, Y: -3}
  - {path: mParentTask, value: 64}
  - path: mCosts
    value:
    - {ItemClass: /Game/FactoryGame/Resource/Parts/SteelPipe/Desc_SteelPipe.Desc_SteelPipe_C, Amount: 200}
    - {ItemClass: /Game/FactoryGame/Resource/Parts/CopperSheet/Desc_CopperSheet.Desc_CopperSheet_C, Amount: 200}
    - {ItemClass: /Game/FactoryGame/Resource/Parts/Plastic/Desc_Plastic.Desc_Plastic_C, Amount: 100}
  - path: mRewards
    value:
    - {ItemClass: /Game/FactoryGame/Resource/Parts/SpaceElevatorParts/Desc_SpaceElevatorPart_1.Desc_SpaceElevatorPart_1_C, Amount: 5}
  unlocks:
  - class: /Game/FactoryGame/Unlocks/BP_UnlockRecipe.BP_UnlockRecipe_C
    properties:
    - path: mRecipes
      value: [/KLib/Assets/Buildings/Faxit/Recipes/Recipe_CS_Input_Fluid.Recipe_CS_Input_Fluid_C, /KLib/Assets/Buildings/Faxit/Recipes/Recipe_CS_Output_Fluid.Recipe_CS_Output_Fluid_C,
        Recipe_Faxit_InputGas, Recipe_Faxit_OutputGas, /KLib/Assets/Buildings/Faxit/Recipes/Recipe_CS_Cable_3.Recipe_CS_Cable_3_C]
- id: Task_AutomatedDelivery
  class: /Script/KAPI.KAPIDeliveryTask
  properties:
  - {path: mName, value: Automated Delivery}
  - {path: mDescription, value: Unlock Faxit delivery building plus one manual-delivery slot and one queue slot.}
  - {path: mIcon, value: /KLib/Assets/Buildings/Faxit/_Teleporter/Icon_Levelpad.Icon_Levelpad}
  - {path: mPriority, value: 88}
  - path: mCoordinate
    value: {X: -1, Y: -4}
  - {path: mParentTask, value: 192}
  - {path: bRequireAllParents, value: false}
  - path: mCosts
    value:
    - {ItemClass: /Game/FactoryGame/Resource/Parts/CircuitBoard/Desc_CircuitBoard.Desc_CircuitBoard_C, Amount: 100}
    - {ItemClass: /Game/FactoryGame/Resource/Parts/Computer/Desc_Computer.Desc_Computer_C, Amount: 25}
    - {ItemClass: /Game/FactoryGame/Resource/Parts/ModularFrameHeavy/Desc_ModularFrameHeavy.Desc_ModularFrameHeavy_C, Amount: 10}
  - path: mRewards
    value:
    - {ItemClass: /Game/FactoryGame/Resource/Parts/SpaceElevatorParts/Desc_SpaceElevatorPart_2.Desc_SpaceElevatorPart_2_C, Amount: 5}
  unlocks:
  - class: /Game/FactoryGame/Unlocks/BP_UnlockRecipe.BP_UnlockRecipe_C
    properties:
    - path: mRecipes
      value: [/KLib/Assets/Buildings/Faxit/Recipes/Recipe_CS_Delivery.Recipe_CS_Delivery_C]
  - class: /KPrivateCodeLib/Unlocks/BP_DeliverInventorySlotUnlock.BP_DeliverInventorySlotUnlock_C
    properties:
    - {path: mNumInventorySlotsToUnlock, value: 1}
  - class: /Script/KPrivateCodeLib.KPCLDeliveryTaskQueueSlotUnlock
    properties:
    - {path: mAmount, value: 1}
- id: Task_RemoteTerminal
  class: /Script/KAPI.KAPIDeliveryTask
  properties:
  - {path: mName, value: Remote Terminal}
  - {path: mDescription, value: Unlock Faxit terminal and remote access.}
  - {path: mIcon, value: /KPrivateCodeLib/Unlocks/TXUI_FaxitLogo.TXUI_FaxitLogo}
  - {path: mPriority, value: 87}
  - path: mCoordinate
    value: {X: 1, Y: -5}
  - {path: mParentTask, value: 192}
  - {path: bRequireAllParents, value: true}
  - path: mCosts
    value:
    - {ItemClass: /Game/FactoryGame/Resource/Parts/Computer/Desc_Computer.Desc_Computer_C, Amount: 100}
    - {ItemClass: /Game/FactoryGame/Resource/Parts/HighSpeedConnector/Desc_HighSpeedConnector.Desc_HighSpeedConnector_C, Amount: 50}
    - {ItemClass: /KLib/Assets/Parts/Production/TimeCrystal/Desc_TimeC_StabilizedTimeCrystal.Desc_TimeC_StabilizedTimeCrystal_C, Amount: 25}
  - path: mRewards
    value:
    - {ItemClass: /Game/FactoryGame/Resource/Environment/Crystal/Desc_CrystalShard.Desc_CrystalShard_C, Amount: 5}
  unlocks:
  - class: /Game/FactoryGame/Unlocks/BP_UnlockRecipe.BP_UnlockRecipe_C
    properties:
    - path: mRecipes
      value: [/KLib/Assets/Buildings/Faxit/Recipes/Recipe_CS_Terminal.Recipe_CS_Terminal_C]
  - class: /KPrivateCodeLib/Unlocks/BP_FaxitFeatureUnlock.BP_FaxitFeatureUnlock_C
    properties:
    - {path: mFeature, value: RemoteAccess}
- id: Task_NetworkBackbone
  class: /Script/KAPI.KAPIDeliveryTask
  properties:
  - {path: mName, value: Network Backbone}
  - {path: mDescription, value: 'Unlock network tower, large pole and fourth cable style.'}
  - {path: mIcon, value: /KLib/Assets/Buildings/Faxit/UI/Icons/Icon_BuildS_NetworkTower.Icon_BuildS_NetworkTower}
  - {path: mPriority, value: 86}
  - path: mCoordinate
    value: {X: -1, Y: -6}
  - {path: mParentTask, value: 192}
  - {path: bRequireAllParents, value: false}
  - path: mCosts
    value:
    - {ItemClass: /Game/FactoryGame/Resource/Parts/AluminumCasing/Desc_AluminumCasing.Desc_AluminumCasing_C, Amount: 500}
    - {ItemClass: /Game/FactoryGame/Resource/Parts/ModularFrameLightweight/Desc_ModularFrameLightweight.Desc_ModularFrameLightweight_C, Amount: 50}
    - {ItemClass: /KLib/Assets/Parts/Production/TimeCrystal/Desc_TimeC_Cable.Desc_TimeC_Cable_C, Amount: 1500}
  - path: mRewards
    value:
    - {ItemClass: /Game/FactoryGame/Resource/Parts/SpaceElevatorParts/Desc_SpaceElevatorPart_3.Desc_SpaceElevatorPart_3_C, Amount: 5}
  unlocks:
  - class: /Game/FactoryGame/Unlocks/BP_UnlockRecipe.BP_UnlockRecipe_C
    properties:
    - path: mRecipes
      value: [/KLib/Assets/Buildings/Faxit/Recipes/Recipe_CS_Tower.Recipe_CS_Tower_C, /KLib/Assets/Buildings/Faxit/Recipes/Recipe_CS_PoleStand_2.Recipe_CS_PoleStand_2_C,
        /KLib/Assets/Buildings/Faxit/Recipes/Recipe_CS_Cable_4.Recipe_CS_Cable_4_C]
- id: Task_MediumDrive
  class: /Script/KAPI.KAPIDeliveryTask
  properties:
  - {path: mName, value: Medium Dimensional Storage}
  - {path: mDescription, value: 'Unlock medium Faxit disk, fifth cable style and second drive slot.'}
  - {path: mIcon, value: /Game/FactoryGame/Buildable/Factory/TradingPost/UI/RecipeIcons/Recipe_Icon_Upgrade.Recipe_Icon_Upgrade}
  - {path: mPriority, value: 85}
  - path: mCoordinate
    value: {X: 1, Y: -7}
  - {path: mParentTask, value: 192}
  - {path: bRequireAllParents, value: true}
  - path: mCosts
    value:
    - {ItemClass: /Game/FactoryGame/Resource/Parts/Computer/Desc_Computer.Desc_Computer_C, Amount: 200}
    - {ItemClass: /KLib/Assets/Parts/Production/TimeCrystal/Desc_TimeC_StabilizedTimeCrystal.Desc_TimeC_StabilizedTimeCrystal_C, Amount: 100}
    - {ItemClass: /Game/FactoryGame/Resource/Parts/CrystalOscillator/Desc_CrystalOscillator.Desc_CrystalOscillator_C, Amount: 50}
    - {ItemClass: /KLib/Assets/Parts/NetworkHardDrives/Desc_Faxit_DimensionalDrive_Mk1.Desc_Faxit_DimensionalDrive_Mk1_C, Amount: 1}
  - path: mRewards
    value:
    - {ItemClass: /Game/FactoryGame/Resource/Parts/SpaceElevatorParts/Desc_SpaceElevatorPart_4.Desc_SpaceElevatorPart_4_C, Amount: 5}
  unlocks:
  - class: /Game/FactoryGame/Unlocks/BP_UnlockRecipe.BP_UnlockRecipe_C
    properties:
    - path: mRecipes
      value: [Recipe_FaxitDrive_Mk2, /KLib/Assets/Buildings/Faxit/Recipes/Recipe_CS_Cable_5.Recipe_CS_Cable_5_C]
  - class: /KPrivateCodeLib/Unlocks/BP_FaxitCapaUnlock.BP_FaxitCapaUnlock_C
    properties:
    - {path: mCapacityType, value: Drive}
    - {path: mAmount, value: 1}
