  - {path: mIcon, value: /Game/FactoryGame/Buildable/Factory/TradingPost/UI/RecipeIcons/Recipe_Icon_Upgrade.Recipe_Icon_Upgrade}
  - {path: mPriority, value: 81}
  - path: mCoordinate
    value: {X: 1, Y: -11}
  - {path: mParentTask, value: 192}
  - {path: bRequireAllParents, value: true}
  - path: mCosts
    value:
    - {ItemClass: /Game/FactoryGame/Resource/Parts/ComputerSuper/Desc_ComputerSuper.Desc_ComputerSuper_C, Amount: 250}
    - {ItemClass: /Game/FactoryGame/Resource/Parts/ModularFrameFused/Desc_ModularFrameFused.Desc_ModularFrameFused_C, Amount: 150}
    - {ItemClass: /KLib/Assets/Parts/Production/TimeCrystal/Desc_TimeC_QuantumProcessor.Desc_TimeC_QuantumProcessor_C, Amount: 20}
    - {ItemClass: /KLib/Assets/Parts/NetworkHardDrives/Desc_Faxit_DimensionalDrive_Mk4.Desc_Faxit_DimensionalDrive_Mk4_C, Amount: 1}
  - path: mRewards
    value:
    - {ItemClass: /Game/FactoryGame/Resource/Parts/SpaceElevatorParts/Desc_SpaceElevatorPart_8.Desc_SpaceElevatorPart_8_C, Amount: 5}
  unlocks:
  - class: /KPrivateCodeLib/Unlocks/BP_FaxitFeatureUnlock.BP_FaxitFeatureUnlock_C
    properties:
    - {path: mFeature, value: Depot}
  - class: /KPrivateCodeLib/Unlocks/BP_FaxitFeatureUnlock.BP_FaxitFeatureUnlock_C
    properties:
    - {path: mFeature, value: Sink}
