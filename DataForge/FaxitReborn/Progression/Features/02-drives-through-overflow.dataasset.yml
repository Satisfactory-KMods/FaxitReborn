type: dataasset
assets:
- id: Task_LargeDrive
  class: /Script/KAPI.KAPIDeliveryTask
  properties:
  - {path: mName, value: Large Dimensional Storage}
  - {path: mDescription, value: Unlock large Faxit disk and third drive slot.}
  - {path: mIcon, value: /Game/FactoryGame/Buildable/Factory/TradingPost/UI/RecipeIcons/Recipe_Icon_Upgrade.Recipe_Icon_Upgrade}
  - {path: mPriority, value: 84}
  - path: mCoordinate
    value: {X: -1, Y: -8}
  - {path: mParentTask, value: 192}
  - {path: bRequireAllParents, value: false}
  - path: mCosts
    value:
    - {ItemClass: /Game/FactoryGame/Resource/Parts/ComputerSuper/Desc_ComputerSuper.Desc_ComputerSuper_C, Amount: 100}
    - {ItemClass: /KLib/Assets/Parts/Production/TimeCrystal/Desc_TimeC_Adapter.Desc_TimeC_Adapter_C, Amount: 25}
    - {ItemClass: /Game/FactoryGame/Resource/Parts/AluminumCasing/Desc_AluminumCasing.Desc_AluminumCasing_C, Amount: 1000}
    - {ItemClass: /KLib/Assets/Parts/NetworkHardDrives/Desc_Faxit_DimensionalDrive_Mk2.Desc_Faxit_DimensionalDrive_Mk2_C, Amount: 1}
  - path: mRewards
    value:
    - {ItemClass: /Game/FactoryGame/Resource/Parts/SpaceElevatorParts/Desc_SpaceElevatorPart_5.Desc_SpaceElevatorPart_5_C, Amount: 5}
  unlocks:
  - class: /Game/FactoryGame/Unlocks/BP_UnlockRecipe.BP_UnlockRecipe_C
    properties:
    - path: mRecipes
      value: [Recipe_FaxitDrive_Mk3]
  - class: /KPrivateCodeLib/Unlocks/BP_FaxitCapaUnlock.BP_FaxitCapaUnlock_C
    properties:
    - {path: mCapacityType, value: Drive}
    - {path: mAmount, value: 1}
- id: Task_HugeDrive
