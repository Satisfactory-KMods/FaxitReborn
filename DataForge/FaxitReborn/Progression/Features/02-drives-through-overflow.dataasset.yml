  properties:
  - {path: mName, value: Huge Dimensional Storage}
  - {path: mDescription, value: Unlock huge Faxit disk and fourth drive slot.}
  - {path: mIcon, value: /Game/FactoryGame/Buildable/Factory/TradingPost/UI/RecipeIcons/Recipe_Icon_Upgrade.Recipe_Icon_Upgrade}
  - {path: mPriority, value: 83}
  - path: mCoordinate
    value: {X: 1, Y: -9}
  - {path: mParentTask, value: 192}
  - {path: bRequireAllParents, value: true}
  - path: mCosts
    value:
    - {ItemClass: /Game/FactoryGame/Resource/Parts/MotorLightweight/Desc_MotorLightweight.Desc_MotorLightweight_C, Amount: 100}
    - {ItemClass: /Game/FactoryGame/Resource/Parts/ModularFrameFused/Desc_ModularFrameFused.Desc_ModularFrameFused_C, Amount: 100}
    - {ItemClass: /KLib/Assets/Parts/Production/TimeCrystal/Desc_TimeC_QuantumProcessor.Desc_TimeC_QuantumProcessor_C, Amount: 10}
    - {ItemClass: /KLib/Assets/Parts/NetworkHardDrives/Desc_Faxit_DimensionalDrive_Mk3.Desc_Faxit_DimensionalDrive_Mk3_C, Amount: 1}
  - path: mRewards
    value:
    - {ItemClass: /Game/FactoryGame/Resource/Parts/SpaceElevatorParts/Desc_SpaceElevatorPart_6.Desc_SpaceElevatorPart_6_C, Amount: 5}
  unlocks:
  - class: /Game/FactoryGame/Unlocks/BP_UnlockRecipe.BP_UnlockRecipe_C
    properties:
    - path: mRecipes
      value: [Recipe_FaxitDrive_Mk4]
  - class: /KPrivateCodeLib/Unlocks/BP_FaxitCapaUnlock.BP_FaxitCapaUnlock_C
    properties:
    - {path: mCapacityType, value: Drive}
    - {path: mAmount, value: 1}
- id: Task_DeliveryThroughput
  class: /Script/KAPI.KAPIDeliveryTask
  properties:
  - {path: mName, value: Delivery Throughput}
  - {path: mDescription, value: Add two manual-delivery inventory slots and two simultaneous queue slots.}
  - {path: mIcon, value: /Game/FactoryGame/Buildable/Factory/TradingPost/UI/RecipeIcons/Recipe_Icon_Upgrade.Recipe_Icon_Upgrade}
  - {path: mPriority, value: 82}
  - path: mCoordinate
    value: {X: -1, Y: -10}
  - {path: mParentTask, value: 192}
  - {path: bRequireAllParents, value: false}
  - path: mCosts
    value:
    - {ItemClass: /Game/FactoryGame/Resource/Parts/ComputerSuper/Desc_ComputerSuper.Desc_ComputerSuper_C, Amount: 150}
    - {ItemClass: /Game/FactoryGame/Resource/Parts/CoolingSystem/Desc_CoolingSystem.Desc_CoolingSystem_C, Amount: 200}
    - {ItemClass: /KLib/Assets/Parts/Production/TimeCrystal/Desc_TimeC_Adapter.Desc_TimeC_Adapter_C, Amount: 75}
  - path: mRewards
    value:
    - {ItemClass: /Game/FactoryGame/Resource/Parts/SpaceElevatorParts/Desc_SpaceElevatorPart_7.Desc_SpaceElevatorPart_7_C, Amount: 5}
  unlocks:
  - class: /KPrivateCodeLib/Unlocks/BP_DeliverInventorySlotUnlock.BP_DeliverInventorySlotUnlock_C
    properties:
    - {path: mNumInventorySlotsToUnlock, value: 2}
  - class: /Script/KPrivateCodeLib.KPCLDeliveryTaskQueueSlotUnlock
    properties:
    - {path: mAmount, value: 2}
- id: Task_OverflowAutomation
