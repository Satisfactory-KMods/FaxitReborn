  - {path: mName, value: Project-Part Recycling License}
  - {path: mDescription, value: Authorize phase-based recycling of obsolete Project Assembly parts.}
  - {path: mIcon, value: /Game/FactoryGame/Buildable/Factory/TradingPost/UI/RecipeIcons/Recipe_Icon_Upgrade.Recipe_Icon_Upgrade}
  - {path: mPriority, value: 30}
  - path: mTags
    value: [KMods.Delivery.GateUnlock]
