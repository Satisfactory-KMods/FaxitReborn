type: dataasset
assets:
- id: Recycle_SpaceElevatorPart_1
  class: /Script/KAPI.KAPIDeliveryTask
  properties:
  - {path: mName, value: Recycle Smart Plating}
  - {path: mDescription, value: Recycle 2500 surplus Smart Plating for one Somersloop and two Mercer Spheres; repeat up to 50 times.}
  - {path: mIcon, value: /Game/FactoryGame/Buildable/Factory/TradingPost/UI/RecipeIcons/Recipe_Icon_Upgrade.Recipe_Icon_Upgrade}
  - {path: mPriority, value: 24}
  - path: mCoordinate
    value: {X: 19, Y: -2}
  - {path: mParentTask, value: 4}
  - {path: bIsEndless, value: true}
  - path: mPoolElements
    value:
    - mItem: /Game/FactoryGame/Resource/Parts/SpaceElevatorParts/Desc_SpaceElevatorPart_1.Desc_SpaceElevatorPart_1_C
      mAmountRange:
        LowerBound: {Type: Inclusive, Value: 50}
        UpperBound: {Type: Exclusive, Value: 51}
      mRequiredTas: -1
  - path: mTaskRewards
    value:
    - mRewards:
      - {ItemClass: /Game/FactoryGame/Prototype/WAT/Desc_WAT1.Desc_WAT1_C, Amount: 1}
      - {ItemClass: /Game/FactoryGame/Prototype/WAT/Desc_WAT2.Desc_WAT2_C, Amount: 2}
      mRequiredTask: -1
  - {path: mMaxTasks, value: 50}
  - {path: mAmountMultiplierCurve, value: /KDataForge/GenAssets/FaxitReborn.Gen_FaxitReborn_RecyclingCostMultiplier}
  - path: mAbsolutMaxItemAmount
    value: {RF_SOLID: /KDataForge/GenAssets/FaxitReborn.Gen_FaxitReborn_RecyclingSolidAmountCap}
