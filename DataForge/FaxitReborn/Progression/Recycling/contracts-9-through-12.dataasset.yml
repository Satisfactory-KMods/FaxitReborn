type: dataasset
assets:
- id: Recycle_SpaceElevatorPart_9
  class: /Script/KAPI.KAPIDeliveryTask
  properties:
  - {path: mName, value: Recycle Nuclear Pasta}
  - {path: mDescription, value: Recycle 1250 surplus Nuclear Pasta for one Somersloop and two Mercer Spheres; repeat up to 50 times.}
  - {path: mIcon, value: /Game/FactoryGame/Buildable/Factory/TradingPost/UI/RecipeIcons/Recipe_Icon_Upgrade.Recipe_Icon_Upgrade}
  - {path: mPriority, value: 16}
  - path: mCoordinate
    value: {X: 19, Y: -6}
  - {path: mParentTask, value: 128}
  - {path: bIsEndless, value: true}
  - path: mPoolElements
    value:
    - mItem: /Game/FactoryGame/Resource/Parts/SpaceElevatorParts/Desc_SpaceElevatorPart_9.Desc_SpaceElevatorPart_9_C
      mAmountRange:
        LowerBound: {Type: Inclusive, Value: 25}
        UpperBound: {Type: Exclusive, Value: 26}
      mRequiredTas: -1
  - path: mTaskRewards
    value:
    - mRewards:
      - {ItemClass: /Game/FactoryGame/Prototype/WAT/Desc_WAT1.Desc_WAT1_C, Amount: 1}
      - {ItemClass: /Game/FactoryGame/Prototype/WAT/Desc_WAT2.Desc_WAT2_C, Amount: 2}
      mRequiredTask: -1
  - {path: mMaxTasks, value: 50}
  - {path: mAmountMultiplierCurve, value: /KDataForge/GenAssets/FaxitReborn.Gen_FaxitReborn_RecyclingCostMultiplier}
  - path: mAbsolutMaxItemAmount
    value: {RF_SOLID: /KDataForge/GenAssets/FaxitReborn.Gen_FaxitReborn_RecyclingSolidAmountCap}
