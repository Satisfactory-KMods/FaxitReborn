type: dataasset
assets:
- id: Task_HazardousLogistics
  class: /Script/KAPI.KAPIDeliveryTask
  properties:
  - {path: mName, value: Hazardous Logistics}
  - {path: mDescription, value: License Faxit handling contracts for radioactive fuel and nuclear waste.}
  - {path: mIcon, value: /Game/FactoryGame/Resource/Parts/IodineInfusedFilter/UI/IconDesc_HazmatFilter_64.IconDesc_HazmatFilter_64}
  - {path: mPriority, value: 30}
  - path: mTags
    value: [KMods.Delivery.GateUnlock]
  - path: mCoordinate
    value: {X: -20, Y: -1}
  - path: mCosts
    value:
    - {ItemClass: /Game/FactoryGame/Resource/Parts/IodineInfusedFilter/Desc_HazmatFilter.Desc_HazmatFilter_C, Amount: 50}
    - {ItemClass: /Game/FactoryGame/Resource/Parts/AluminumCasing/Desc_AluminumCasing.Desc_AluminumCasing_C, Amount: 250}
    - {ItemClass: /Game/FactoryGame/Resource/Parts/ResourceSinkCoupon/Desc_ResourceSinkCoupon.Desc_ResourceSinkCoupon_C, Amount: 10}
  - path: mRewards
    value:
    - {ItemClass: /Game/FactoryGame/Resource/Environment/Crystal/Desc_CrystalShard.Desc_CrystalShard_C, Amount: 2}
  dependencies:
  - class: /Game/FactoryGame/AvailabilityDependencies/BP_GamePhaseReachedDependency.BP_GamePhaseReachedDependency_C
    properties:
    - {path: mGamePhase, value: EGP_EndGame}
    - {path: mOnlyAllowInSelectedPhase, value: false}
- id: Hazard_UraniumFuel
  class: /Script/KAPI.KAPIDeliveryTask
  properties:
  - {path: mName, value: Uranium Fuel Logistics}
  - {path: mDescription, value: Transfer 250 Uranium Fuel Rods for one Somersloop and two Mercer Spheres; repeat up to 50 times.}
  - {path: mIcon, value: /Game/FactoryGame/Resource/Parts/NuclearFuelRod/UI/IconDesc_NuclearFuelRod_64.IconDesc_NuclearFuelRod_64}
  - {path: mPriority, value: 29}
  - path: mCoordinate
    value: {X: -21, Y: -2}
  - {path: mParentTask, value: 128}
  - {path: bIsEndless, value: true}
  - path: mPoolElements
    value:
    - mItem: /Game/FactoryGame/Resource/Parts/NuclearFuelRod/Desc_NuclearFuelRod.Desc_NuclearFuelRod_C
      mAmountRange:
        LowerBound: {Type: Inclusive, Value: 5}
        UpperBound: {Type: Exclusive, Value: 6}
      mRequiredTas: -1
  - path: mTaskRewards
    value:
    - mRewards:
      - {ItemClass: /Game/FactoryGame/Prototype/WAT/Desc_WAT1.Desc_WAT1_C, Amount: 1}
      - {ItemClass: /Game/FactoryGame/Prototype/WAT/Desc_WAT2.Desc_WAT2_C, Amount: 2}
      mRequiredTask: -1
  - {path: mMaxTasks, value: 50}
  - {path: mAmountMultiplierCurve, value: /KDataForge/GenAssets/FaxitReborn.Gen_FaxitReborn_RecyclingCostMultiplier}
  - path: mAbsolutMaxItemAmount
    value: {RF_SOLID: /KDataForge/GenAssets/FaxitReborn.Gen_FaxitReborn_RecyclingSolidAmountCap}
  dependencies:
  - class: /Game/FactoryGame/AvailabilityDependencies/BP_GamePhaseReachedDependency.BP_GamePhaseReachedDependency_C
    properties:
    - {path: mGamePhase, value: EGP_EndGame}
    - {path: mOnlyAllowInSelectedPhase, value: false}
