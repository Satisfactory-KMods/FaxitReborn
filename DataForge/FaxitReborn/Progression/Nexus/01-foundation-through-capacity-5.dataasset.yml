type: dataasset
assets:
- id: Task_FaxitFoundation
  class: /Script/KAPI.KAPIDeliveryTask
  properties:
  - {path: mName, value: Faxit Steel Foundation}
  - {path: mDescription, value: 'Establish first Faxit core, network wiring and dimensional disk using Tier 3 steel parts.'}
  - {path: mIcon, value: /KLib/Assets/Buildings/Faxit/UI/Icons/Icon_ConverterMk1.Icon_ConverterMk1}
  - {path: mPriority, value: 100}
  - path: mCoordinate
    value: {X: 0, Y: -1}
  - path: mCosts
    value:
    - {ItemClass: /Game/FactoryGame/Resource/Parts/SteelPipe/Desc_SteelPipe.Desc_SteelPipe_C, Amount: 100}
    - {ItemClass: /Game/FactoryGame/Resource/Parts/SteelPlate/Desc_SteelPlate.Desc_SteelPlate_C, Amount: 100}
    - {ItemClass: /Game/FactoryGame/Resource/Parts/ModularFrame/Desc_ModularFrame.Desc_ModularFrame_C, Amount: 25}
    - {ItemClass: /KLib/Assets/Parts/Production/TimeCrystal/Desc_TimeC_Cable.Desc_TimeC_Cable_C, Amount: 250}
  - path: mRewards
    value:
    - {ItemClass: /Game/FactoryGame/Resource/Environment/Crystal/Desc_CrystalShard.Desc_CrystalShard_C, Amount: 2}
  dependencies:
  - class: /Game/FactoryGame/AvailabilityDependencies/BP_SchematicPurchasedDependency.BP_SchematicPurchasedDependency_C
    properties:
    - path: mSchematics
      value: [/Game/FactoryGame/Schematics/Progression/Schematic_3-4.Schematic_3-4_C]
    - {path: mRequireAllSchematicsToBePurchased, value: true}
  unlocks:
  - class: /Game/FactoryGame/Unlocks/BP_UnlockRecipe.BP_UnlockRecipe_C
    properties:
    - path: mRecipes
      value: [/KLib/Assets/Buildings/Faxit/Recipes/Recipe_CS_Core.Recipe_CS_Core_C, /KLib/Assets/Buildings/Faxit/Recipes/Recipe_CS_Cable.Recipe_CS_Cable_C, /KLib/Assets/Buildings/Faxit/Recipes/Recipe_CS_PoleStand.Recipe_CS_PoleStand_C,
        /KLib/Assets/Buildings/Faxit/Recipes/Recipe_Cs_PoleWall.Recipe_Cs_PoleWall_C, /KLib/Assets/Buildings/Faxit/Recipes/Recipe_CS_PoleWallDouble.Recipe_CS_PoleWallDouble_C,
        Recipe_Faxit_PolarizationFrame, Recipe_Faxit_PoledKerrCrystal, Recipe_Faxit_DataCable, Recipe_Faxit_QuantumCableAdapter, Recipe_Faxit_PhotonicProcessor, Recipe_FaxitDrive_Mk1]
  - class: /KPrivateCodeLib/Unlocks/BP_DeliverInventorySlotUnlock.BP_DeliverInventorySlotUnlock_C
    properties:
    - {path: mNumInventorySlotsToUnlock, value: 2}
