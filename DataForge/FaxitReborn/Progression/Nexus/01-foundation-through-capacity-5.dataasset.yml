    value: {X: 0, Y: -2}
  - {path: mParentTask, value: 8}
  - path: mCosts
    value:
    - {ItemClass: /Game/FactoryGame/Resource/Parts/SteelPipe/Desc_SteelPipe.Desc_SteelPipe_C, Amount: 200}
    - {ItemClass: /Game/FactoryGame/Resource/Parts/SteelPlate/Desc_SteelPlate.Desc_SteelPlate_C, Amount: 100}
    - {ItemClass: /KLib/Assets/Parts/Production/TimeCrystal/Desc_TimeC_Cable.Desc_TimeC_Cable_C, Amount: 500}
  - path: mRewards
