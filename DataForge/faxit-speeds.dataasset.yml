type: dataasset
assets:
  # Dedicated speed chain. Each node changes exactly one Faxit rate and grants one vanilla item reward.
  - id: Task_SolidSpeed60
    class: /Script/KAPI.KAPIDeliveryTask
    properties:
      - path: mName
        value: "Solid Transfer 60/min"
      - path: mDescription
        value: "Raise Faxit solid transfer from 15 to 60 items per minute."
      - path: mIcon
        value: /Game/FactoryGame/Buildable/Factory/TradingPost/UI/RecipeIcons/Recipe_Icon_Upgrade.Recipe_Icon_Upgrade
      - path: mPriority
        value: 60
      - path: mCoordinate
        value:
          X: 0
          Y: -11
      - path: mParentTask
        value: 8
        # Bottom
      - path: mCosts
        value:
          - ItemClass: /Game/FactoryGame/Resource/Parts/SteelPipe/Desc_SteelPipe.Desc_SteelPipe_C
            Amount: 250
          - ItemClass: /Game/FactoryGame/Resource/Parts/Motor/Desc_Motor.Desc_Motor_C
            Amount: 25
      - path: mRewards
        value:
          - ItemClass: /Game/FactoryGame/Resource/Environment/Crystal/Desc_CrystalShard.Desc_CrystalShard_C
            Amount: 2
    unlocks:
      - class: /KPrivateCodeLib/Unlocks/BP_FaxitSpeedUnlock.BP_FaxitSpeedUnlock_C
        properties:
          - path: mAmount
            value: 45
          - path: bIsFluid
            value: false

