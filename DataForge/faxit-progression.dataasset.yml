              - Recipe_Faxit_PolarizationFrame
              - Recipe_Faxit_PoledKerrCrystal
              - Recipe_Faxit_DataCable
              - Recipe_Faxit_IronSheet
              - Recipe_FaxitDrive_Mk1
      - class: /KPrivateCodeLib/Unlocks/BP_DeliverInventorySlotUnlock.BP_DeliverInventorySlotUnlock_C
        properties:
