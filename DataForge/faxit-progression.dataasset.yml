type: dataasset
assets:
  # Vertical spine. Root starts at (0,-1); every later node moves toward smaller Y only.
  - id: Task_FaxitFoundation
    class: /Script/KAPI.KAPIDeliveryTask
    properties:
      - path: mName
        value: "Faxit Steel Foundation"
      - path: mDescription
        value:
          "Establish first Faxit core, network wiring and dimensional disk using
          Tier 3 steel parts."
      - path: mIcon
        value: /KLib/Assets/Buildings/Faxit/UI/Icons/Icon_ConverterMk1.Icon_ConverterMk1
      - path: mPriority
        value: 100
      - path: mCoordinate
        value:
          X: 0
          Y: -1
      - path: mCosts
        value:
          - ItemClass: /Game/FactoryGame/Resource/Parts/SteelPipe/Desc_SteelPipe.Desc_SteelPipe_C
            Amount: 100
          - ItemClass: /Game/FactoryGame/Resource/Parts/SteelPlate/Desc_SteelPlate.Desc_SteelPlate_C
            Amount: 100
          - ItemClass: /Game/FactoryGame/Resource/Parts/ModularFrame/Desc_ModularFrame.Desc_ModularFrame_C
            Amount: 25
      - path: mRewards
        value:
          - ItemClass: /Game/FactoryGame/Resource/Environment/Crystal/Desc_CrystalShard.Desc_CrystalShard_C
            Amount: 2
    dependencies:
      - class: /Script/FactoryGame.FGSchematicPurchasedDependency
        properties:
          - path: mSchematics
            value:
              - /Game/FactoryGame/Schematics/Progression/Schematic_3-4.Schematic_3-4_C
          - path: mRequireAllSchematicsToBePurchased
            value: true
    unlocks:
      - class: /Game/FactoryGame/Unlocks/BP_UnlockRecipe.BP_UnlockRecipe_C
        properties:
          - path: mRecipes
            value:
              - /KLib/Assets/Buildings/Faxit/Recipes/Recipe_CS_Core.Recipe_CS_Core_C
              - /KLib/Assets/Buildings/Faxit/Recipes/Recipe_CS_Cable.Recipe_CS_Cable_C
