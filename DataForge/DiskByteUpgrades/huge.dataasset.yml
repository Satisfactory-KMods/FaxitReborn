# Five optional, one-time upgrades branching from the huge disk unlock.
# Each adds 20 percentage points to ALL disk capacities, not just this disk tier.
type: dataasset
assets:
  - id: Upgrade_DiskBytes_Huge_1
    class: /Script/KAPI.KAPIDeliveryTask
    properties:
      - path: mName
        value: "Huge Disk Bytes I"
      - path: mDescription
        value: "Increase every Faxit disk's base byte capacity by +20%. Bonuses add together; existing byte allocations are preserved."
      - path: mIcon
        value: /KLib/Assets/Parts/NetworkHardDrives/UI/Icon_Faxit_DimensionalDrive_Mk4.Icon_Faxit_DimensionalDrive_Mk4
      - path: mPriority
        value: 81
      - path: mCoordinate
        value:
          X: 2
          Y: -9
      - path: mParentTask
        value: 2
      - path: bRequireAllParents
        value: true
      - path: bIsEndless
        value: false
      - path: mCosts
        value:
          - ItemClass: /Game/FactoryGame/Resource/Parts/MotorLightweight/Desc_MotorLightweight.Desc_MotorLightweight_C
            Amount: 250
          - ItemClass: /Game/FactoryGame/Resource/Parts/ModularFrameFused/Desc_ModularFrameFused.Desc_ModularFrameFused_C
            Amount: 350
          - ItemClass: /KLib/Assets/Parts/Production/TimeCrystal/Desc_TimeC_QuantumProcessor.Desc_TimeC_QuantumProcessor_C
            Amount: 500
          - ItemClass: /Game/FactoryGame/Resource/Parts/ComputerSuper/Desc_ComputerSuper.Desc_ComputerSuper_C
            Amount: 650
          - ItemClass: /Game/FactoryGame/Resource/Parts/AluminumCasing/Desc_AluminumCasing.Desc_AluminumCasing_C
            Amount: 800
    unlocks:
      - class: /KPrivateCodeLib/Unlocks/BP_FaxitCapaUnlock.BP_FaxitCapaUnlock_C
        properties:
          - path: mCapacityType
            value: DiskBytes
          - path: mAmount
            value: 20

