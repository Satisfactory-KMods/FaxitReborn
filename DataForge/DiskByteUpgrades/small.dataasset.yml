# Five optional, one-time upgrades branching from the small disk unlock.
# Each adds 20 percentage points to ALL disk capacities, not just this disk tier.
type: dataasset
assets:
  - id: Upgrade_DiskBytes_Small_1
    class: /Script/KAPI.KAPIDeliveryTask
    properties:
      - path: mName
        value: "Small Disk Bytes I"
      - path: mDescription
        value: "Increase every Faxit disk's base byte capacity by +20%. Bonuses add together; existing byte allocations are preserved."
      - path: mIcon
        value: /KLib/Assets/Parts/NetworkHardDrives/UI/Icon_Faxit_DimensionalDrive_Mk1.Icon_Faxit_DimensionalDrive_Mk1
      - path: mPriority
        value: 84
      - path: mCoordinate
        value:
          X: 1
          Y: -1
      - path: mParentTask
        value: 2
      - path: bRequireAllParents
        value: true
      - path: bIsEndless
        value: false
      - path: mCosts
        value:
          - ItemClass: /Game/FactoryGame/Resource/Parts/ModularFrame/Desc_ModularFrame.Desc_ModularFrame_C
            Amount: 250
          - ItemClass: /Game/FactoryGame/Resource/Parts/Rotor/Desc_Rotor.Desc_Rotor_C
            Amount: 350
          - ItemClass: /Game/FactoryGame/Resource/Parts/SteelPlate/Desc_SteelPlate.Desc_SteelPlate_C
            Amount: 500
          - ItemClass: /Game/FactoryGame/Resource/Parts/CopperSheet/Desc_CopperSheet.Desc_CopperSheet_C
            Amount: 650
          - ItemClass: /Game/FactoryGame/Resource/Parts/SteelPipe/Desc_SteelPipe.Desc_SteelPipe_C
            Amount: 800
    unlocks:
      - class: /KPrivateCodeLib/Unlocks/BP_FaxitCapaUnlock.BP_FaxitCapaUnlock_C
        properties:
          - path: mCapacityType
            value: DiskBytes
          - path: mAmount
            value: 20

