# Five optional, one-time upgrades branching from the large disk unlock.
# Each adds 20 percentage points to ALL disk capacities, not just this disk tier.
type: dataasset
assets:
  - id: Upgrade_DiskBytes_Large_1
    class: /Script/KAPI.KAPIDeliveryTask
    properties:
      - path: mName
        value: "Large Disk Bytes I"
      - path: mDescription
        value: "Increase every Faxit disk's base byte capacity by +20%. Bonuses add together; existing byte allocations are preserved."
      - path: mIcon
        value: /KLib/Assets/Parts/NetworkHardDrives/UI/Icon_Faxit_DimensionalDrive_Mk3.Icon_Faxit_DimensionalDrive_Mk3
      - path: mPriority
        value: 82
      - path: mCoordinate
        value:
          X: -2
          Y: -8
      - path: mParentTask
        value: 4
      - path: bRequireAllParents
        value: true
      - path: bIsEndless
        value: false
      - path: mCosts
        value:
          - ItemClass: /Game/FactoryGame/Resource/Parts/ModularFrameHeavy/Desc_ModularFrameHeavy.Desc_ModularFrameHeavy_C
            Amount: 250
          - ItemClass: /Game/FactoryGame/Resource/Parts/CrystalOscillator/Desc_CrystalOscillator.Desc_CrystalOscillator_C
            Amount: 350
          - ItemClass: /Game/FactoryGame/Resource/Parts/Computer/Desc_Computer.Desc_Computer_C
            Amount: 500
          - ItemClass: /Game/FactoryGame/Resource/Parts/CircuitBoardHighSpeed/Desc_CircuitBoardHighSpeed.Desc_CircuitBoardHighSpeed_C
            Amount: 650
          - ItemClass: /Game/FactoryGame/Resource/Parts/Rubber/Desc_Rubber.Desc_Rubber_C
            Amount: 800
    unlocks:
      - class: /KPrivateCodeLib/Unlocks/BP_FaxitCapaUnlock.BP_FaxitCapaUnlock_C
        properties:
          - path: mCapacityType
            value: DiskBytes
          - path: mAmount
            value: 20

